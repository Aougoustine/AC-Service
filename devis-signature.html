<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votre devis — AC SERVICE</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-mid:#010e22; --cyan:#00b4d8; --white:#f0f4ff; --text-light:#a8c0d6;
  --border:rgba(0,180,216,.2); --danger:#ff5c5c; --ok:#2ecc8f;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;background:linear-gradient(180deg,#011331 0%,#000 100%);color:var(--white);min-height:100vh;padding:1.5rem 1rem;}
.wrap{max-width:640px;margin:0 auto;}
.header{text-align:center;margin-bottom:1.5rem;}
.header h1{font-family:'Rajdhani',sans-serif;font-size:1.6rem;text-transform:uppercase;letter-spacing:.04em;}
.header h1 span{color:var(--cyan);}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:14px;padding:1.5rem;margin-bottom:1.2rem;}
.card h3{font-family:'Rajdhani',sans-serif;text-transform:uppercase;letter-spacing:.03em;color:var(--cyan);font-size:1rem;margin-bottom:.8rem;}
.row{display:flex;justify-content:space-between;font-size:.9rem;padding:.4rem 0;border-bottom:1px solid rgba(255,255,255,.06);}
.row:last-child{border-bottom:none;}
.row .lbl{color:var(--text-light);}
table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:.5rem;}
th{text-align:left;font-family:'Rajdhani',sans-serif;text-transform:uppercase;font-size:.72rem;color:var(--text-light);padding:.5rem .3rem;border-bottom:1px solid var(--border);}
td{padding:.6rem .3rem;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top;}
.totals{margin-top:1rem;background:rgba(0,180,216,.08);border:1px solid rgba(0,180,216,.3);border-radius:10px;padding:1rem 1.2rem;}
.totals .row{border:none;}
.totals .final{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.2rem;color:var(--cyan);}
canvas{width:100%;height:160px;display:block;background:#fff;border-radius:8px;cursor:crosshair;touch-action:none;}
.btn{font-family:'Rajdhani',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border:none;border-radius:50px;padding:.85rem 1.4rem;font-size:.95rem;cursor:pointer;width:100%;margin-top:.6rem;}
.btn-primary{background:linear-gradient(135deg,var(--cyan),#0077b6);color:#fff;}
.btn-danger{background:rgba(255,92,92,.15);color:var(--danger);border:1px solid rgba(255,92,92,.4);}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--white);border:1px solid var(--border);}
.check-row{display:flex;align-items:flex-start;gap:.6rem;font-size:.85rem;color:var(--text-light);margin:.8rem 0;}
.check-row input{margin-top:.2rem;width:auto;}
.status-banner{text-align:center;padding:1.2rem;border-radius:10px;font-family:'Rajdhani',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.status-ok{background:rgba(46,204,143,.12);color:var(--ok);border:1px solid rgba(46,204,143,.35);}
.status-danger{background:rgba(255,92,92,.12);color:var(--danger);border:1px solid rgba(255,92,92,.35);}
.loading, .error-msg{text-align:center;padding:3rem 1rem;color:var(--text-light);}
</style>
</head>
<body>
  <div class="wrap">
    <div class="header"><h1>AC <span>SERVICE</span> — Votre devis</h1></div>
    <div id="content"><div class="loading">Chargement du devis…</div></div>
  </div>
  <script src="assets/page-devis-signature.js"></script>
</body>
</html>
